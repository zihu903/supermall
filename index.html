<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no" />
    <title>网络网页</title>
    <style type="text/css">
      .btn {
        display: block;
        margin: 20px auto;
        padding: 5px;
        background-color: #007aff;
        border: 0;
        color: #ffffff;
        height: 40px;
        width: 200px;
      }

      .btn-red {
        background-color: #dd524d;
      }

      .btn-yellow {
        background-color: #f0ad4e;
      }

      .desc {
        padding: 10px;
        color: #999999;
      }

      .post-message-section {
        visibility: hidden;
      }
    </style>
  </head>
  <body>
    <p class="desc">web-view 组件加载网络 html 示例。点击下列按钮，跳转至其它页面。</p>
    <div class="btn-list">
      <button class="btn" type="button" data-action="navigateTo">navigateTo</button>
      <button class="btn" type="button" data-action="redirectTo">redirectTo</button>
      <button class="btn" type="button" data-action="navigateBack">navigateBack</button>
      <button class="btn" type="button" data-action="reLaunch">reLaunch</button>
      <button class="btn" type="button" data-action="switchTab">switchTab</button>
    </div>
    <div class="post-message-section">
      <p class="desc">网页向应用发送消息，注意：小程序端应用会在此页面后退时接收到消息。</p>
      <div class="btn-list">
        <button class="btn btn-red" type="button" id="postMessage">postMessage</button>
      </div>
    </div>
    <p class="desc" id="statusMessage" style="color: #dd524d; display: none;"></p>

    <script type="text/javascript" src="uni.webview.1.5.6.js"></script>
    <script type="text/javascript">
      (function() {
        var sdkReady = false;
        var SDK_TIMEOUT_MS = 5000;

        function showError(msg) {
          var el = document.getElementById('statusMessage');
          if (el) {
            el.textContent = msg;
            el.style.display = 'block';
          }
          console.error('[supermall] ' + msg);
        }

        function invokeAction(action) {
          if (!sdkReady || typeof uni === 'undefined') {
            showError('SDK 未就绪，无法执行操作: ' + action);
            return;
          }
          try {
            var url = '/pages/index/index';
            switch (action) {
              case 'navigateTo':
                uni.navigateTo({ url: url });
                break;
              case 'redirectTo':
                uni.redirectTo({ url: url });
                break;
              case 'navigateBack':
                uni.navigateBack({ delta: 1 });
                break;
              case 'reLaunch':
                uni.reLaunch({ url: url });
                break;
              case 'switchTab':
                uni.switchTab({ url: url });
                break;
              default:
                showError('未知的操作类型: ' + action);
                return;
            }
          } catch (err) {
            showError(action + ' 调用失败: ' + (err.message || err));
          }
        }

        // Bind click handlers for navigation buttons
        try {
          var buttons = document.querySelectorAll('.btn-list .btn[data-action]');
          for (var i = 0; i < buttons.length; i++) {
            buttons[i].addEventListener('click', function(e) {
              var action = e.currentTarget.getAttribute('data-action');
              if (!action) {
                showError('按钮缺少 data-action 属性');
                return;
              }
              invokeAction(action);
            });
          }
        } catch (err) {
          showError('绑定按钮事件失败: ' + (err.message || err));
        }

        // Bind postMessage button
        var postBtn = document.getElementById('postMessage');
        if (postBtn) {
          postBtn.addEventListener('click', function() {
            if (!sdkReady || typeof uni === 'undefined') {
              showError('SDK 未就绪，无法发送消息');
              return;
            }
            try {
              uni.postMessage({
                data: {
                  action: 'message',
                  timestamp: new Date().getTime(),
                  message: 'Hello from Web Page!'
                }
              });
            } catch (err) {
              showError('postMessage 调用失败: ' + (err.message || err));
            }
          });
        } else {
          console.warn('[supermall] postMessage 按钮未找到');
        }

        // Wait for SDK bridge
        document.addEventListener('UniAppJSBridgeReady', function() {
          sdkReady = true;
          // Reveal the post-message section once the bridge is available
          var section = document.querySelector('.post-message-section');
          if (section) {
            section.style.visibility = 'visible';
          }
          console.log('[supermall] UniAppJSBridge 就绪');
        });

        // Timeout fallback: warn if bridge never becomes ready
        setTimeout(function() {
          if (!sdkReady) {
            console.warn('[supermall] UniAppJSBridge 在 ' + SDK_TIMEOUT_MS + 'ms 内未就绪，按钮操作可能不可用');
          }
        }, SDK_TIMEOUT_MS);
      })();
    </script>
  </body>
</html>
